<!-- email-billing-alert.html -- one callout, dropped into ALERTS. It carries its own bottom spacing, so an empty ALERTS leaves no gap. Tokens: ALERT_TITLE ALERT_TEXT -->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation">
	<tr>
		<td style="padding:0 0 20px 0;">
			<table class="notice" width="100%" cellpadding="0" cellspacing="0" role="presentation" bgcolor="#fff8e6" style="background-color:#fff8e6;border:1px solid #f0c36d;border-left:4px solid #ff9f00;border-radius:4px;">
				<tr>
					<td style="padding:14px 16px;font-size:15px;line-height:1.5;color:#4a3a12;">
						<p style="margin:0 0 4px;font-size:15px;line-height:1.4;color:#4a3a12;"><strong style="color:#4a3a12;">##ALERT_TITLE##</strong></p>
						<p style="margin:0;font-size:14px;line-height:1.5;color:#4a3a12;">##ALERT_TEXT##</p>
					</td>
				</tr>
			</table>
		</td>
	</tr>
</table>
